# dsh-team-workflow bundle patch
#
# 三件事：
#   1. 把包内 skills/ 目录挂成一个独立的 skill provider（不碰默认根目录）
#   2. 把 web 服务的搜索后端指到自带的免 key provider
#   3. 挂载插件本体
#      （团队规范注入 / 审计日志 / 上下文节流 / rtk 输出压缩 / lens / 联网搜索 / CLI 命令）
#
# 定位包内 skills/ 为什么是 createRequire 而不是 `baseUrl + 'skills/'`：
# `baseUrl` 在 bundle patch 里**不是**该包所在目录。2026-10-15 实测（把 baseUrl 写进文件
# 求出来的）：插件 patch 里它是 `file:///C:/Users/<用户>/.dsh/profiles/desktop/` —— 也就是
# **profile 目录**。于是 `baseUrl + 'skills/'` 指到 profile 下并不存在的 skills/，provider
# 一个技能都发现不了，而且**全程静默**（只有一行 warn，12 个 skill 就这么一直没生效）。
# 改成从 baseUrl 解析本包 package.json 再取 dirname，是 dsh 自己同一用途的写法
# （dsh-base 里挂 dsh-agent-preset/skills 那行）；它在 baseUrl 为包目录或 profile 目录
# 两种语义下都成立，所以不会随 dsh 修这个语义而再坏一次。
#
# 为什么第 2 条能改到已有行：profile 的补丁是按 bundle 顺序逐层叠的
# （dsh-app-boot 的 composeEntries），同一 id 后面的层覆盖前面的。
# `web` 行是 dsh-base 建在 host 层的，而 tauri profile 的 bundle 列表里
# dsh-base 排在我们前面，所以这里的 config 会盖掉出厂的
# searchProvider: deepseek-official。
# 注：tauri 宿主（dsh-web-app）还会把 `tool-web` 整行 disabled: true，
# 那是给预设留的口子（预设里重新开），不是这里要管的事。

- insert:
    - id: dsh-team-workflow-skills
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        includeDefaultRoots: false
        providerName: dsh-team-workflow
        customSkillDirs:
          - !!js >-
              process.getBuiltinModule('node:path').join(
              process.getBuiltinModule('node:path').dirname(
              process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('dsh-team-workflow/package.json')),
              'skills')

    - id: dsh-team-workflow
      name: dsh-team-workflow

- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: bing
    fetchProvider: http
